services:
  - type: web
    name: same-day-customer-growth-pack
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd sales-engine-app && npm install
    startCommand: cd sales-engine-app && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: same-day-growth-pack-db
          property: connectionString

databases:
  - name: same-day-growth-pack-db
    plan: free
    region: oregon
    databaseName: growth_pack
    user: growth_pack
