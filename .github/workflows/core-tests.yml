name: FDOS Portable Core Tests

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run portable evidence/experiment core tests
        run: node core/fdos-core.test.js
      - name: Run next-best-action decision engine tests
        run: node core/decision-engine.test.js
