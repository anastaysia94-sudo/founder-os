name: Sync Sales CRM Workbook
on:
  push:
    branches: [main]
    paths:
      - 'sales-engine-app/data/leads.json'
      - 'sales-engine/pipeline-history.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Synchronize canonical CRM workbook
        run: |
          python - <<'PY'
          import json, os
          from openpyxl import load_workbook
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          leads_path='sales-engine-app/data/leads.json'
          hist_path='sales-engine/pipeline-history.json'
          xlsx_path='sales-engine/Same-Day-Customer-Growth-Pack-Live-CRM.xlsx'
          with open(leads_path,encoding='utf-8') as f: leads_doc=json.load(f)
          with open(hist_path,encoding='utf-8') as f: hist_doc=json.load(f)
          wb=load_workbook(xlsx_path)

          def replace_sheet(name):
              if name in wb.sheetnames:
                  i=wb.sheetnames.index(name)
                  ws=wb[name]
                  wb.remove(ws)
                  return wb.create_sheet(name,i)
              return wb.create_sheet(name)

          def style(ws, widths=None):
              fill=PatternFill('solid', fgColor='17365D')
              for c in ws[1]:
                  c.font=Font(bold=True,color='FFFFFF')
                  c.fill=fill
                  c.alignment=Alignment(vertical='center',wrap_text=True)
              ws.freeze_panes='A2'
              ws.auto_filter.ref=ws.dimensions
              for row in ws.iter_rows(min_row=2):
                  for c in row: c.alignment=Alignment(vertical='top',wrap_text=True)
              if widths:
                  for col,w in widths.items(): ws.column_dimensions[col].width=w

          ws=replace_sheet('Fresh Leads')
          headers=['Rank','Business','Category','City','Tier','Opportunity','Email','Reachability','Angle','Subject','Initial Pitch','Source','Verified','Status']
          ws.append(headers)
          for lead in leads_doc.get('leads',[]):
              ws.append([lead.get(k) for k in ['rank','business','category','city','tier','opportunity','email','reachability','angle','subject','initial','source','verified','status']])
          style(ws, {'A':7,'B':30,'C':30,'D':25,'E':8,'F':55,'G':34,'H':40,'I':55,'J':42,'K':80,'L':48,'M':14,'N':18})

          ws=replace_sheet('Pipeline History')
          headers=['Business','Stage','First Touch','Channel','First Touch Evidence','FU1 Due','FU1 Sent','FU1 Evidence','FU2 Due','FU2 Sent','FU2 Evidence','Quoted','Offer Value','Paid','Next Action','Archived']
          ws.append(headers)
          for business,r in hist_doc.get('records',{}).items():
              ws.append([business,r.get('stage'),r.get('firstTouch'),r.get('firstTouchChannel'),r.get('firstTouchEvidence'),r.get('fu1Due'),r.get('fu1Sent'),r.get('fu1Evidence'),r.get('fu2Due'),r.get('fu2Sent'),r.get('fu2Evidence'),r.get('quoted',0),r.get('offerValue',150),r.get('paid',0),r.get('nextAction'),r.get('archived')])
          style(ws, {'A':40,'B':18,'C':24,'D':14,'E':42,'F':14,'G':24,'H':42,'I':14,'J':24,'K':42,'L':12,'M':14,'N':12,'O':75,'P':14})

          # Audit sheet makes synchronization explicit without inventing activity.
          ws=replace_sheet('Sync Audit')
          ws.append(['Field','Value'])
          ws.append(['Workbook Sync Date', leads_doc.get('meta',{}).get('lastUpdated')])
          ws.append(['Lead Source', leads_path])
          ws.append(['Pipeline Source', hist_path])
          ws.append(['Fresh Lead Count', len(leads_doc.get('leads',[]))])
          ws.append(['Pipeline Record Count', len(hist_doc.get('records',{}))])
          ws.append(['Integrity Rule', hist_doc.get('rule')])
          style(ws, {'A':24,'B':110})

          wb.save(xlsx_path)
          PY
      - name: Commit synchronized workbook
        run: |
          if git diff --quiet -- sales-engine/Same-Day-Customer-Growth-Pack-Live-CRM.xlsx; then
            echo "Workbook already synchronized."
            exit 0
          fi
          git config user.name "Founder OS Sales Sync"
          git config user.email "actions@users.noreply.github.com"
          git add sales-engine/Same-Day-Customer-Growth-Pack-Live-CRM.xlsx
          git commit -m "Sync Same-Day Customer Growth Pack CRM workbook"
          git push
