name: Cloudflare migration checks
on:
  push:
    branches: [migration-cloudflare-free]
    paths:
      - "four-offer-launch/cloudflare/**"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: four-offer-launch/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/worker.js
      - run: bash ../tools/build-products.sh
      - run: test -s ../public/products/remote-career-diy.zip
      - run: test -s ../public/products/ai-project-handoff.zip
      - run: test -s ../public/products/lnc-expanded.zip
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
