name: DoubleTap RC2 Android CI

on:
  push:
    branches:
      - ci/doubletap-rewards-rc2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout CI carrier branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Decode DoubleTap RC2 source
        shell: bash
        run: |
          rm -rf /tmp/doubletap-rc2
          mkdir -p /tmp/doubletap-rc2
          base64 -d .ci-doubletap/DoubleTap-Rewards-1.0-RC2-source.zip.b64.txt > /tmp/doubletap-rc2/source.zip
          echo "be531562f7c5498c0423fc58dc312353afb4436b4c86a9f676141ea02ee85700  /tmp/doubletap-rc2/source.zip" | sha256sum -c -
          unzip -q /tmp/doubletap-rc2/source.zip -d /tmp/doubletap-rc2

      - name: Static release checks
        working-directory: /tmp/doubletap-rc2/doubletap-rewards
        run: python3 scripts/static_release_checks.py

      - name: Lint, test, APK and AAB
        working-directory: /tmp/doubletap-rc2/doubletap-rewards
        run: gradle --no-daemon --non-interactive --stacktrace :app:lint :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease

      - name: Stage build outputs
        shell: bash
        run: |
          mkdir -p .ci-doubletap/out
          cp /tmp/doubletap-rc2/doubletap-rewards/app/build/outputs/apk/debug/app-debug.apk .ci-doubletap/out/DoubleTap-Rewards-1.0-RC2-debug.apk
          cp /tmp/doubletap-rc2/doubletap-rewards/app/build/outputs/bundle/release/app-release.aab .ci-doubletap/out/DoubleTap-Rewards-1.0-RC2-release-unsigned.aab
          sha256sum .ci-doubletap/out/* > .ci-doubletap/out/SHA256SUMS.txt

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: doubletap-rewards-1.0-rc2-build
          path: .ci-doubletap/out/
          if-no-files-found: error
