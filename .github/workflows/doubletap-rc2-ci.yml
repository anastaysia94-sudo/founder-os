name: DoubleTap RC5 Android CI

on:
  push:
    branches:
      - ci/doubletap-rewards-rc2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout CI carrier branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up current Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android API 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          "$SDKMANAGER" --version
          PLATFORM_PACKAGE="$(
            "$SDKMANAGER" --list | awk -F'|' '/platforms;android-37/ {gsub(/[[:space:]]/, "", $1); print $1}' | sort -V | tail -n 1
          )"
          test -n "$PLATFORM_PACKAGE"
          echo "Installing $PLATFORM_PACKAGE"
          "$SDKMANAGER" "platform-tools" "$PLATFORM_PACKAGE" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Decode DoubleTap RC5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/doubletap-rc5
          mkdir -p /tmp/doubletap-rc5
          base64 -d .ci-doubletap/DoubleTap-Rewards-1.0-RC5-source.zip.b64.txt > /tmp/doubletap-rc5/source.zip
          echo "599e8abf23936588e39105a70df0c7a1b738fc43bec9d049b8a6f6fdfb7a51e4  /tmp/doubletap-rc5/source.zip" | sha256sum -c -
          unzip -q /tmp/doubletap-rc5/source.zip -d /tmp/doubletap-rc5

      - name: Static release checks
        working-directory: /tmp/doubletap-rc5/doubletap-rewards
        run: python3 scripts/static_release_checks.py

      - name: Lint, test, APK and AAB
        working-directory: /tmp/doubletap-rc5/doubletap-rewards
        run: gradle --no-daemon --non-interactive --stacktrace :app:lint :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease

      - name: Stage build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-doubletap/out
          cp /tmp/doubletap-rc5/doubletap-rewards/app/build/outputs/apk/debug/app-debug.apk .ci-doubletap/out/DoubleTap-Rewards-1.0-RC5-debug.apk
          cp /tmp/doubletap-rc5/doubletap-rewards/app/build/outputs/bundle/release/app-release.aab .ci-doubletap/out/DoubleTap-Rewards-1.0-RC5-release-unsigned.aab
          sha256sum .ci-doubletap/out/* > .ci-doubletap/out/SHA256SUMS.txt

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: doubletap-rewards-1.0-rc5-build
          path: .ci-doubletap/out/
          if-no-files-found: error
