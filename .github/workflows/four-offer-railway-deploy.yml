name: Four Offer Railway Direct Deploy

on:
  push:
    branches: [main]
    paths:
      - 'four-offer-launch/**'
      - '.github/workflows/four-offer-railway-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 69cde62c-640e-429b-ae4d-5a4df5274108
      RAILWAY_ENVIRONMENT_ID: 0c78fdbd-27a2-4c9d-a085-d10e06c138c3
      RAILWAY_SERVICE_ID: 4bd0d3e4-07be-415a-90c9-26dbd08ebe26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Railway credential is configured
        run: test -n "$RAILWAY_TOKEN"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy current Four Offer source to existing service
        run: |
          railway up four-offer-launch \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --ci --path-as-root \
            --message "Four Offer direct CI deploy $GITHUB_SHA"
