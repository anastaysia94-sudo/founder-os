name: PHP Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.php' -not -path './vendor/*' -print)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No PHP files found.'
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          for file in "${files[@]}"; do
            php -l "$file"
          done
