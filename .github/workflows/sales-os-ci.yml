name: Sales OS CI

on:
  push:
    branches: [main]
    paths:
      - 'sales-engine-app/**'
      - '.github/workflows/sales-os-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sales-engine-app/**'
      - '.github/workflows/sales-os-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-engine-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sales-engine-app/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Syntax validation
        run: npm run check
      - name: Verify required PWA files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon.svg
          test -f data/leads.json
          test -f data/scripts.json
