name: Deploy Sales Engine + WASTEBounty to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sales-engine-app/**'
      - 'wastebounty-site/**'
      - '.github/workflows/deploy-sales-engine-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sales-engine-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect GitHub Pages availability
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"

          if [ "$status" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages is enabled; continuing deployment.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled or is not accessible to this workflow (HTTP ${status}). Skipping deployment instead of failing CI. Enable Pages with GitHub Actions as the source in repository Settings > Pages, then rerun this workflow."
          fi

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a sales-engine-app/. _site/
          mkdir -p _site/wastebounty
          cp -a wastebounty-site/public/. _site/wastebounty/

      - name: Upload combined Pages site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
