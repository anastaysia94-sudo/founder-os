name: Founder OS Standalone Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'db/migrations/**'
      - '.github/workflows/standalone-web.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Type check
        run: npx tsc --noEmit
      - name: Build standalone web product
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder-key
          FDOS_DEPLOY_REV: ci-${{ github.sha }}
        run: npm run build
      - name: Verify implemented standalone and production-testability contract
        working-directory: .
        run: |
          grep -q 'Business Operating System' web/app/layout.tsx
          grep -q 'WebApplication' web/app/layout.tsx
          grep -q 'Idea' web/app/page.tsx
          grep -q 'Business DNA' web/app/page.tsx
          grep -q 'Value Map' web/app/page.tsx
          grep -q 'Decision' web/app/page.tsx
          grep -q 'Business Memory' web/app/page.tsx
          grep -q 'Opportunity' web/app/page.tsx
          grep -q 'Risk' web/app/page.tsx
          grep -q 'Evidence' web/app/page.tsx
          grep -q 'Sales' web/app/page.tsx
          grep -q 'BUSINESS X-RAY' web/app/intelligence/page.tsx
          grep -q 'IDEA LAB' web/app/intelligence/page.tsx
          grep -q 'WHAT AM I MISSING' web/app/intelligence/page.tsx
          grep -q 'VALUE SPRINTS' web/app/intelligence/page.tsx
          grep -q 'getBusinessXRay' web/lib/fdos.ts
          grep -q 'getMissingIntelligence' web/lib/fdos.ts
          grep -q 'addValueSprint' web/lib/business-store.ts
          grep -q 'fdos_value_sprints' db/migrations/20260913_add_fdos_value_sprints.sql
          grep -q 'fdos value sprints own rows' db/migrations/20260913_add_fdos_value_sprints.sql
          grep -q 'fdos_store_website_evidence' web/app/api/evidence/website/route.ts
          grep -q 'Production acceptance diagnostics' web/app/acceptance/page.tsx
          grep -q 'Copy diagnostic snapshot' web/app/acceptance/page.tsx
          grep -q 'index: false' web/app/acceptance/layout.tsx
          grep -q 'follow: false' web/app/acceptance/layout.tsx
          grep -q 'security invoker' db/migrations/20260913_add_atomic_fdos_website_evidence_capture.sql
          grep -q 'fdos_store_website_evidence' db/migrations/20260913_restrict_fdos_rpc_execute_to_authenticated.sql
          grep -q 'fdos_business_records' db/migrations/20260913_enforce_fdos_business_relationships_in_rls.sql
          grep -q 'evidence_id is null' db/migrations/20260913_enforce_fdos_evidence_relationships_in_rls.sql
          grep -q 'sourceRevision' web/app/api/health/route.ts
          grep -q 'cache-control' web/app/api/health/route.ts
          test -f web/app/robots.ts
          test -f web/app/sitemap.ts
          test -f web/app/manifest.ts
          test -f web/app/answers/page.tsx
          test -f web/app/intelligence/page.tsx
          test -f web/app/intelligence/intelligence.module.css
          test -f web/app/acceptance/page.tsx
          test -f web/app/acceptance/layout.tsx
          test -f web/app/api/health/route.ts
          echo 'Founder Dynasty OS standalone shell, intelligence layer, value sprint persistence, relational RLS, evidence integrity, and production-testability contract verified.'
