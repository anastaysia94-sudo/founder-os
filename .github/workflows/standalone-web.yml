name: Founder OS Standalone Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/standalone-web.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Type check
        run: npx tsc --noEmit
      - name: Build standalone web product
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder-key
          FDOS_DEPLOY_REV: ci-${{ github.sha }}
        run: npm run build
      - name: Verify implemented standalone and production-testability contract
        working-directory: .
        run: |
          grep -q 'Business Operating System' web/app/layout.tsx
          grep -q 'WebApplication' web/app/layout.tsx
          grep -q 'Idea' web/app/page.tsx
          grep -q 'Business DNA' web/app/page.tsx
          grep -q 'Value Map' web/app/page.tsx
          grep -q 'Decision' web/app/page.tsx
          grep -q 'Business Memory' web/app/page.tsx
          grep -q 'Opportunity' web/app/page.tsx
          grep -q 'Risk' web/app/page.tsx
          grep -q 'Evidence' web/app/page.tsx
          grep -q 'Sales' web/app/page.tsx
          grep -q 'sourceRevision' web/app/api/health/route.ts
          grep -q 'cache-control' web/app/api/health/route.ts
          test -f web/app/robots.ts
          test -f web/app/sitemap.ts
          test -f web/app/manifest.ts
          test -f web/app/answers/page.tsx
          test -f web/app/api/health/route.ts
          echo 'Founder Dynasty OS standalone source and production-testability contract verified.'
