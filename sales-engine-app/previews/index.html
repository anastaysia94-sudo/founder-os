<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Growth Pack Prospect Samples</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111e;color:#eef4ff}header{padding:26px 20px;background:linear-gradient(135deg,#0f172a,#1e3a8a)}h1{margin:4px 0 8px;font-size:clamp(26px,5vw,44px)}header p{max-width:950px;color:#cbd5e1}.grid{max-width:1300px;margin:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}.card{background:#0f172a;border:1px solid #26364d;border-radius:22px;overflow:hidden}.sample{min-height:300px;padding:24px;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--a),var(--b));color:var(--t)}.sample:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-70px;top:-60px;background:var(--x);opacity:.22}.sample:after{content:"";position:absolute;width:150px;height:150px;border:16px solid var(--t);opacity:.12;border-radius:30px;right:28px;bottom:-70px;transform:rotate(28deg)}.tag{position:relative;font-size:11px;font-weight:900;letter-spacing:.12em;opacity:.82}.sample h2{position:relative;margin:56px 0 12px;font-size:29px;line-height:1.03;max-width:92%}.sample p{position:relative;line-height:1.45;font-weight:650;max-width:90%}.cta{position:absolute;left:24px;bottom:24px;background:var(--t);color:var(--a);border-radius:999px;padding:10px 13px;font-size:12px;font-weight:900}.meta{padding:18px}.meta h3{margin:0 0 8px}.meta p{color:#cbd5e1;line-height:1.45}.route{font-family:ui-monospace,monospace;color:#7dd3fc}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#17345d;color:#bfdbfe;font-size:11px;font-weight:800}a{color:#7dd3fc}</style></head><body><header><small>SMARTPICKSHOP HOLDINGS • SALES OS</small><h1>Prospect-Specific Sample Pipeline</h1><p id="offer">Loading offer…</p></header><main class="grid" id="grid"></main><script>const pal={1:['#101010','#1595D3','#fff','#d9effa'],2:['#174EA6','#4AAE5B','#fff','#eaf7ec'],3:['#1677B8','#E99A2B','#fff','#fff0d6'],4:['#0B2D45','#1AA7B8','#fff','#F28C28'],5:['#F39A32','#FFC928','#111','#FFF4DA'],6:['#2E3438','#B98A5B','#fff','#7BA9C5'],7:['#17466E','#F05A28','#fff','#E7EBEE'],8:['#003E52','#F47A20','#fff','#f4d2b8'],9:['#275F31','#F5A623','#fff','#fff1bd'],10:['#C8292C','#1F6FA8','#fff','#D9DEE3']};fetch('../data/outreach-pipeline.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('offer').textContent=`${d.offer.name}: $${d.offer.price} via PayPal to ${d.offer.paypal}. ${d.offer.delivery}.`;const g=document.getElementById('grid');d.prospects.forEach(p=>{const c=pal[p.rank]||['#111827','#334155','#fff','#94a3b8'];const e=document.createElement('article');e.className='card';e.innerHTML=`<div class="sample" style="--a:${c[0]};--b:${c[1]};--t:${c[2]};--x:${c[3]}"><div class="tag">ORIGINAL SAMPLE • #${p.rank}</div><h2>${p.headline}</h2><p>${p.supportingLine}</p><div class="cta">${p.cta}</div></div><div class="meta"><span class="status">${p.stage}</span><h3>${p.business}</h3><p><b>Palette:</b> ${p.palette}</p><p><b>Graphic concept:</b> ${p.visual}</p><p><b>Contact route:</b> <span class="route">${p.route}</span></p><p><b>Subject:</b> ${p.subject}</p><p><b>Next action:</b> ${p.action}</p><p><a href="${p.source}" target="_blank" rel="noreferrer">Open source</a></p></div>`;g.appendChild(e)})}).catch(e=>document.getElementById('offer').textContent='Could not load pipeline: '+e.message)</script></body></html>
